<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cartwheel Trace Viewer</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --border: #e4e1da;
    --text: #24211c;
    --text-dim: #6b6558;
    --accent: #2b5b8c;
    --accent-soft: #dce9f5;
    --green: #2f7a3d;
    --green-bg: #e9f5ea;
    --red: #b3341c;
    --red-bg: #fbeae5;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #1b1a17;
    --panel: #242320;
    --border: #3a3833;
    --text: #e8e6e1;
    --text-dim: #9b968a;
    --accent: #6fa8dc;
    --accent-soft: #24344a;
    --green: #7fc783;
    --green-bg: #1f2e20;
    --red: #e08669;
    --red-bg: #3a211b;
  }
  :root[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #45423b; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
  }
  body { display: flex; flex-direction: column; }

  header {
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; }
  header .sub { font-size: 12px; color: var(--text-dim); }
  #refresh-btn {
    margin-left: auto; border: 1px solid var(--border); background: var(--panel);
    padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--text-dim);
  }
  #theme-toggle {
    border: 1px solid var(--border); background: var(--panel);
    padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--text-dim);
  }

  .layout { display: flex; flex: 1; min-height: 0; }

  /* Trace list */
  #trace-list-pane { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  #trace-filters {
    padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; gap: 6px; flex-shrink: 0;
  }
  #trace-filters select {
    flex: 1; min-width: 0; font-size: 11.5px; padding: 4px 6px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  #trace-list {
    flex: 1; overflow-y: auto; background: var(--panel);
  }
  .trace-row {
    padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 12.5px;
  }
  .trace-row:hover { background: var(--bg); }
  .trace-row.active { background: var(--accent-soft); }
  .trace-row .row1 { display: flex; justify-content: space-between; font-weight: 700; }
  .trace-row .role-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--accent); }
  .trace-row .ts { color: var(--text-dim); font-weight: 400; }
  .trace-row .preview { color: var(--text-dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trace-row .meta-line { margin-top: 3px; color: var(--text-dim); font-size: 11px; }
  .trace-row .version-line { color: var(--accent); font-family: var(--mono); }
  .tag-click { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
  .tag-click:hover { color: var(--text); }
  .badge.tag-click:hover { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  /* Version modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(30, 27, 20, 0.45);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--panel); border-radius: 10px; width: min(820px, 92vw); max-height: 85vh;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 14px;
    font-family: var(--mono); flex-shrink: 0;
  }
  #modal-close { border: none; background: none; font-size: 16px; cursor: pointer; color: var(--text-dim); }
  #modal-close:hover { color: var(--text); }
  .modal-body { padding: 16px 18px; overflow-y: auto; font-size: 13px; }
  .modal-body h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin: 16px 0 6px; }
  .modal-body h4:first-of-type { margin-top: 8px; }
  .version-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .version-meta { font-size: 13px; }
  .commit-message { white-space: pre-wrap; margin-top: 4px; color: var(--text-dim); font-size: 12.5px; }
  .commit-row {
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; margin-bottom: 6px;
    display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 12px;
  }
  .commit-row:hover { background: var(--bg); }
  .mono { font-family: var(--mono); }

  /* Colorized diff */
  .diff-block { font-size: 11.5px; line-height: 1.5; }
  .diff-block span { display: block; white-space: pre-wrap; word-break: break-word; }
  .diff-add { color: var(--green); background: var(--green-bg); }
  .diff-del { color: var(--red); background: var(--red-bg); }
  .diff-hunk { color: var(--accent); font-weight: 700; }
  .diff-file { color: var(--text-dim); font-weight: 700; }

  /* Detail pane */
  #detail { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  #detail-empty { padding: 40px; color: var(--text-dim); font-size: 13px; }
  #detail-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0;
  }
  #detail-header .trace-id { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
  #detail-header .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bg);
    border: 1px solid var(--border); color: var(--text-dim);
  }
  .badge.err { background: var(--red-bg); color: var(--red); border-color: transparent; }

  .tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0; }
  .tab-btn {
    border: none; background: none; padding: 10px 12px; font-size: 12.5px; font-weight: 600;
    color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-content { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Unified trace view: system/user/assistant turns, always visible */
  .turn { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .turn-head {
    padding: 6px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .turn-head.user { background: var(--accent-soft); color: var(--accent); }
  .turn-head.assistant { background: var(--green-bg); color: var(--green); }
  .turn-body { padding: 10px; }
  .msg-text { font-size: 13px; white-space: pre-wrap; line-height: 1.5; }
  .msg-text + .collapsible { margin-top: 8px; }

  /* Collapsible blocks: system prompt + tool calls, both collapsed by default */
  .collapsible { border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; overflow: hidden; }
  .collapsible:first-child { margin-top: 0; }
  .collapsible-head {
    padding: 7px 10px; background: var(--bg); cursor: pointer; font-size: 12px;
    display: flex; align-items: center; gap: 7px;
  }
  .collapsible.system-block { margin-bottom: 12px; }
  .collapsible.system-block .collapsible-head {
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; font-size: 11px; color: var(--text-dim);
  }
  .collapsible.tool-block.failed { border-color: var(--red); }
  .chevron { display: inline-block; transition: transform 0.15s; font-size: 10px; }
  .collapsible.open .chevron { transform: rotate(90deg); }
  .collapsible-body { display: none; padding: 10px 12px; }
  .collapsible.open .collapsible-body { display: block; }
  .fail-tag { color: var(--red); font-weight: 700; font-size: 11px; }
  .ok-tag { color: var(--green); font-weight: 700; font-size: 11px; }
  .dim { color: var(--text-dim); font-size: 11px; font-weight: 400; text-transform: none; letter-spacing: normal; margin-left: auto; }

  .tool-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin: 8px 0 3px; }
  .tool-label:first-child { margin-top: 0; }
  pre.code-block {
    font-family: var(--mono); font-size: 12px; line-height: 1.5; margin: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }
  pre.code-block.result-fail { background: var(--red-bg); border-color: var(--red); }
  .attr-row { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; }
  .attr-row .flag-true { color: var(--red); font-weight: 700; }
  .attr-row .flag-false { color: var(--green); }

  /* Raw view */
  .raw-section { margin-bottom: 16px; }
  .raw-section h3 { font-size: 12px; text-transform: uppercase; color: var(--text-dim); margin: 0 0 6px; }

  .missing { color: var(--text-dim); font-style: italic; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #d8d4cb; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>🔎 Cartwheel Trace Viewer</h1>
  <span class="sub">Read-only — reads live from Langfuse on localhost. No annotation, nothing stored here.</span>
  <button id="refresh-btn">↺ Refresh list</button>
  <button id="theme-toggle" title="Toggle dark mode">🌙</button>
</header>

<div class="layout">
  <div id="trace-list-pane">
    <div id="trace-filters">
      <select id="filter-stage"><option value="">Stage: all</option></select>
      <select id="filter-commit"><option value="">Commit: all</option></select>
    </div>
    <div id="trace-list"><div class="trace-row">Loading traces…</div></div>
  </div>

  <div id="detail">
    <div id="detail-empty">Select a trace on the left.</div>
  </div>
</div>

<div id="version-modal-overlay" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <span id="modal-title"></span>
      <button id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

function fmtJson(v) {
  if (v === undefined) return '<span class="missing">undefined (not recorded)</span>';
  if (v === null) return '<span class="missing">null</span>';
  return escapeHtml(JSON.stringify(v, null, 2));
}

function fmtTime(iso) {
  if (!iso) return '<span class="missing">no timestamp</span>';
  return new Date(iso).toLocaleString();
}

function firstText(messages) {
  if (!messages || !messages.length) return null;
  const msg = Array.isArray(messages) ? messages[0] : messages;
  const part = (msg.parts || []).find(p => p.type === "text");
  return part ? part.content : null;
}

let activeTraceId = null;
let allTraces = [];

function traceAttrs(t) {
  return (t.metadata && t.metadata.attributes) || {};
}

function populateFilterOptions() {
  const stageSel = $("#filter-stage");
  const commitSel = $("#filter-commit");
  const stages = new Set();
  const commits = new Set();
  let untaggedCount = 0;
  for (const t of allTraces) {
    const attrs = traceAttrs(t);
    const stage = attrs["cartwheel.hw_stage"];
    const commit = attrs["cartwheel.git_commit"];
    if (stage) stages.add(stage); else untaggedCount++;
    if (commit) commits.add(commit);
  }
  const prevStage = stageSel.value;
  const prevCommit = commitSel.value;
  stageSel.innerHTML = '<option value="">Stage: all</option>'
    + [...stages].sort().map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("")
    + (untaggedCount ? `<option value="__untagged__">(untagged, ${untaggedCount})</option>` : "");
  commitSel.innerHTML = '<option value="">Commit: all</option>'
    + [...commits].sort().map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  stageSel.value = [...stageSel.options].some(o => o.value === prevStage) ? prevStage : "";
  commitSel.value = [...commitSel.options].some(o => o.value === prevCommit) ? prevCommit : "";
}

function renderTraceList() {
  const list = $("#trace-list");
  const stageFilter = $("#filter-stage").value;
  const commitFilter = $("#filter-commit").value;

  const filtered = allTraces.filter(t => {
    const attrs = traceAttrs(t);
    const stage = attrs["cartwheel.hw_stage"];
    if (stageFilter === "__untagged__" && stage) return false;
    if (stageFilter && stageFilter !== "__untagged__" && stage !== stageFilter) return false;
    if (commitFilter && attrs["cartwheel.git_commit"] !== commitFilter) return false;
    return true;
  });

  if (!allTraces.length) {
    list.innerHTML = '<div class="trace-row">No traces found in Langfuse yet.</div>';
    return;
  }
  if (!filtered.length) {
    list.innerHTML = '<div class="trace-row">No traces match this filter.</div>';
    return;
  }

  list.innerHTML = filtered.map(t => {
    const attrs = traceAttrs(t);
    const role = attrs["cartwheel.user_role"] || "?";
    const userId = attrs["cartwheel.user_id"] || "?";
    const stage = attrs["cartwheel.hw_stage"];
    const commit = attrs["cartwheel.git_commit"];
    const req = firstText(t.input) || '<span class="missing">no input recorded</span>';
    const latency = t.latency != null ? t.latency.toFixed(2) + "s" : '<span class="missing">—</span>';
    const versionHtml = [
      stage ? `<span class="tag-click" data-kind="stage" data-value="${escapeHtml(stage)}">${escapeHtml(stage)}</span>` : "",
      commit ? `<span class="tag-click" data-kind="commit" data-value="${escapeHtml(commit)}">${escapeHtml(commit)}</span>` : "",
    ].filter(Boolean).join(' <span class="dim">@</span> ');
    return `
      <div class="trace-row" data-id="${escapeHtml(t.id)}">
        <div class="row1"><span class="role-tag">${escapeHtml(role)} · user ${escapeHtml(userId)}</span> <span class="ts">${escapeHtml(new Date(t.timestamp).toLocaleTimeString())}</span></div>
        <div class="preview">${typeof req === "string" ? escapeHtml(req) : req}</div>
        <div class="meta-line">latency ${latency} · id ${escapeHtml(t.id.slice(0, 12))}…</div>
        ${versionHtml ? `<div class="meta-line version-line">${versionHtml}</div>` : ""}
      </div>`;
  }).join("");
  $$(".trace-row[data-id]", list).forEach(row => {
    row.onclick = () => selectTrace(row.dataset.id);
  });
  wireTagClicks(list);
}

function wireTagClicks(root) {
  $$(".tag-click", root).forEach(tag => {
    tag.onclick = (e) => {
      e.stopPropagation();
      if (tag.dataset.kind === "stage") showStageInfo(tag.dataset.value);
      else showCommitInfo(tag.dataset.value);
    };
  });
}

async function loadTraces() {
  const resp = await fetch("/api/traces?limit=50");
  const data = await resp.json();
  allTraces = data.data || [];
  populateFilterOptions();
  renderTraceList();
}

function renderCollapsible(headerHtml, bodyHtml, extraClass) {
  return `
    <div class="collapsible ${extraClass || ""}">
      <div class="collapsible-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="chevron">▶</span> ${headerHtml}
      </div>
      <div class="collapsible-body">${bodyHtml}</div>
    </div>
  `;
}

function renderToolBlock(part, obs, responseText) {
  const failed = obs && obs.output && obs.output.ok === false;
  const name = part.name || (obs && obs.name) || "unknown_tool";
  const args = part.arguments !== undefined ? part.arguments : (obs ? obs.input : undefined);
  const attrs = (obs && obs.metadata && obs.metadata.attributes) || {};
  const latency = obs && obs.latency != null ? (obs.latency * 1000).toFixed(0) + "ms" : null;
  const attrRows = Object.entries(attrs)
    .filter(([k]) => k.startsWith("cartwheel."))
    .map(([k, v]) => {
      const cls = v === "true" ? "flag-true" : (v === "false" ? "flag-false" : "");
      return `<div class="attr-row">${escapeHtml(k)}: <span class="${cls}">${escapeHtml(v)}</span></div>`;
    }).join("");

  const statusTag = failed ? '<span class="fail-tag">FAILED</span>' : (obs ? '<span class="ok-tag">ok</span>' : "");
  const timingBits = [latency, obs ? "obs " + (obs.id || "").slice(0, 8) + "…" : null].filter(Boolean).join(" · ");
  const header = `🔧 <strong>${escapeHtml(name)}</strong> ${statusTag} <span class="dim">${escapeHtml(timingBits)}</span>`;

  const resultBlock = obs
    ? `<pre class="code-block ${failed ? "result-fail" : ""}">${fmtJson(obs.output)}</pre>`
    : (responseText != null
        ? `<pre class="code-block">${escapeHtml(responseText)}</pre>`
        : '<p class="missing">No result recorded (no matching TOOL observation and no tool response found).</p>');

  const body = `
    <div class="tool-label">Call ID</div>
    <div class="attr-row">${escapeHtml(part.id || "missing")}</div>
    <div class="tool-label">Arguments</div>
    <pre class="code-block">${fmtJson(args)}</pre>
    <div class="tool-label">Result</div>
    ${resultBlock}
    ${obs ? `
      <div class="tool-label">Started / Ended</div>
      <div class="attr-row">${fmtTime(obs.startTime)} → ${fmtTime(obs.endTime)}</div>
      <div class="tool-label">Attributes</div>
      ${attrRows || '<div class="attr-row missing">none recorded</div>'}
      <div class="tool-label">Status</div>
      <div class="attr-row">level: ${escapeHtml(obs.level)} ${obs.statusMessage ? "— " + escapeHtml(obs.statusMessage) : ""}</div>
    ` : '<div class="attr-row missing">No matching TOOL observation found for this call.</div>'}
  `;

  return renderCollapsible(header, body, "tool-block" + (failed ? " failed" : ""));
}

function renderTrace(conversation, toolCalls) {
  if (!conversation || !conversation.length) {
    return '<p class="missing">No conversation recorded for this trace.</p>';
  }

  // Tool responses live in separate "tool"-role messages in the raw
  // conversation, keyed by the same call id the assistant's tool_call part
  // carries -- used as a fallback if no TOOL observation matches.
  const responsesByCallId = {};
  for (const msg of conversation) {
    if (msg.role !== "tool") continue;
    for (const part of msg.parts || []) {
      if (part.type === "tool_call_response") responsesByCallId[part.id] = part.response;
    }
  }

  // TOOL observations are already sorted by startTime; matched to tool_call
  // parts positionally, in the order each is encountered. Exact for every
  // trace we've tested (one tool call per turn, sequential), best-effort if
  // a future trace ever calls multiple tools in parallel within one turn.
  const toolQueue = [...(toolCalls || [])];
  let toolIndex = 0;

  let html = "";
  for (const msg of conversation) {
    const role = msg.role || "unknown";

    if (role === "system") {
      const text = (msg.parts || []).map(p => p.type === "text" ? (p.content ?? "") : JSON.stringify(p)).join("\n");
      html += renderCollapsible(
        "SYSTEM PROMPT",
        `<div class="msg-text">${escapeHtml(text)}</div>`,
        "system-block"
      );
      continue;
    }
    if (role === "tool") {
      continue; // merged into the preceding assistant turn's tool block
    }

    let body = "";
    for (const part of msg.parts || []) {
      if (part.type === "text") {
        if ((part.content ?? "").trim() !== "") {
          body += `<div class="msg-text">${escapeHtml(part.content)}</div>`;
        }
      } else if (part.type === "tool_call") {
        const obs = toolQueue[toolIndex++];
        body += renderToolBlock(part, obs, responsesByCallId[part.id]);
      } else {
        body += `<div class="msg-text">(unrecognized part type: ${escapeHtml(part.type)})</div><pre class="code-block">${fmtJson(part)}</pre>`;
      }
    }
    html += `<div class="turn"><div class="turn-head ${escapeHtml(role)}">${escapeHtml(role)}</div><div class="turn-body">${body || '<span class="missing">empty</span>'}</div></div>`;
  }
  return html;
}

function renderRaw(data) {
  return `
    <div class="raw-section">
      <h3>Raw trace object</h3>
      <pre class="code-block">${fmtJson(data.trace)}</pre>
    </div>
    <div class="raw-section">
      <h3>Raw observations (${data.observations.length})</h3>
      <pre class="code-block">${fmtJson(data.observations)}</pre>
    </div>
  `;
}

async function selectTrace(traceId) {
  activeTraceId = traceId;
  $$(".trace-row").forEach(r => r.classList.toggle("active", r.dataset.id === traceId));

  const detail = $("#detail");
  detail.innerHTML = '<div id="detail-empty">Loading trace…</div>';

  const resp = await fetch(`/api/traces/${traceId}`);
  if (!resp.ok) {
    detail.innerHTML = `<div id="detail-empty">Failed to load trace: ${resp.status}</div>`;
    return;
  }
  const data = await resp.json();
  const t = data.trace;
  const attrs = (t.metadata && t.metadata.attributes) || {};
  const errorObs = data.observations.filter(o => o.level && o.level !== "DEFAULT");
  const failedTools = data.tool_calls.filter(o => o.output && o.output.ok === false);

  detail.innerHTML = `
    <div id="detail-header">
      <div class="trace-id">${escapeHtml(t.id)}</div>
      <div class="badges">
        <span class="badge">${escapeHtml(attrs["cartwheel.user_role"] || "role: —")}</span>
        <span class="badge">user ${escapeHtml(attrs["cartwheel.user_id"] || "—")}</span>
        <span class="badge">prompt_version ${escapeHtml(attrs["cartwheel.prompt_version"] || "—")}</span>
        ${attrs["cartwheel.hw_stage"] ? `<span class="badge tag-click" data-kind="stage" data-value="${escapeHtml(attrs["cartwheel.hw_stage"])}">${escapeHtml(attrs["cartwheel.hw_stage"])}</span>` : ""}
        ${attrs["cartwheel.git_commit"] ? `<span class="badge tag-click" data-kind="commit" data-value="${escapeHtml(attrs["cartwheel.git_commit"])}">commit ${escapeHtml(attrs["cartwheel.git_commit"])}</span>` : ""}
        <span class="badge">${escapeHtml(t.timestamp ? new Date(t.timestamp).toLocaleString() : "no timestamp")}</span>
        <span class="badge">latency ${t.latency != null ? t.latency.toFixed(2) + "s" : "—"}</span>
        <span class="badge">cost ${t.totalCost != null ? "$" + t.totalCost.toFixed(4) : "—"}</span>
        <span class="badge">${data.observations.length} observations</span>
        ${errorObs.length ? `<span class="badge err">${errorObs.length} non-default level observation(s)</span>` : ""}
        ${failedTools.length ? `<span class="badge err">${failedTools.length} failed tool call(s)</span>` : ""}
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="trace">Trace</button>
      <button class="tab-btn" data-tab="raw">Raw</button>
    </div>
    <div class="tab-content">
      <div class="tab-panel active" data-panel="trace">${renderTrace(data.conversation, data.tool_calls)}</div>
      <div class="tab-panel" data-panel="raw">${renderRaw(data)}</div>
    </div>
  `;

  $$(".tab-btn", detail).forEach(btn => {
    btn.onclick = () => {
      $$(".tab-btn", detail).forEach(b => b.classList.toggle("active", b === btn));
      $$(".tab-panel", detail).forEach(p => p.classList.toggle("active", p.dataset.panel === btn.dataset.tab));
    };
  });
  wireTagClicks(detail);
}

// ---------------------------------------------------------------------------
// Version modal: click any hw_stage or git_commit tag to see how it differs
// from other tags -- trace counts/timestamps (computed client-side from
// already-loaded traces) plus the actual code diff (fetched from the
// server, which runs git locally).
// ---------------------------------------------------------------------------

function openModal(title, bodyHtml) {
  $("#modal-title").textContent = title;
  $("#modal-body").innerHTML = bodyHtml;
  $("#version-modal-overlay").hidden = false;
}

function closeModal() {
  $("#version-modal-overlay").hidden = true;
}

function renderDiff(diffText) {
  if (!diffText || !diffText.trim()) {
    return '<p class="missing">No diff (identical commits, or nothing to show).</p>';
  }
  const lines = diffText.split("\n").map(line => {
    let cls = "diff-ctx";
    if (line.startsWith("+++") || line.startsWith("---")) cls = "diff-file";
    else if (line.startsWith("@@")) cls = "diff-hunk";
    else if (line.startsWith("+")) cls = "diff-add";
    else if (line.startsWith("-")) cls = "diff-del";
    return `<span class="${cls}">${escapeHtml(line)}</span>`;
  });
  return `<div class="code-block diff-block">${lines.join("")}</div>`;
}

function computeTagStats(attrKey, value) {
  let count = 0, first = null, last = null;
  for (const t of allTraces) {
    if (traceAttrs(t)[attrKey] !== value) continue;
    count++;
    if (!first || t.timestamp < first) first = t.timestamp;
    if (!last || t.timestamp > last) last = t.timestamp;
  }
  return { count, first, last };
}

function computeStageCommits(stage) {
  // Commits seen under this stage, sorted by when each was first observed.
  const map = {};
  for (const t of allTraces) {
    const attrs = traceAttrs(t);
    if (attrs["cartwheel.hw_stage"] !== stage) continue;
    const c = attrs["cartwheel.git_commit"];
    if (!c) continue;
    if (!map[c]) map[c] = { commit: c, count: 0, first: t.timestamp, last: t.timestamp };
    map[c].count++;
    if (t.timestamp < map[c].first) map[c].first = t.timestamp;
    if (t.timestamp > map[c].last) map[c].last = t.timestamp;
  }
  return Object.values(map).sort((a, b) => a.first.localeCompare(b.first));
}

function allStagesSorted() {
  const stages = new Set();
  for (const t of allTraces) {
    const s = traceAttrs(t)["cartwheel.hw_stage"];
    if (s) stages.add(s);
  }
  // Sorts hw1 < hw2 < ... < hw10 by the numeric part, not lexically.
  return [...stages].sort((a, b) => {
    const na = parseInt(a.replace(/\D/g, ""), 10);
    const nb = parseInt(b.replace(/\D/g, ""), 10);
    return (isNaN(na) ? 0 : na) - (isNaN(nb) ? 0 : nb);
  });
}

async function showCommitInfo(hash) {
  openModal(hash, '<p class="missing">Loading…</p>');
  const stats = computeTagStats("cartwheel.git_commit", hash);
  let bodyHtml;
  try {
    const resp = await fetch(`/api/git/commit/${encodeURIComponent(hash)}`);
    if (!resp.ok) throw new Error((await resp.json()).detail || resp.status);
    const c = await resp.json();
    bodyHtml = `
      <div class="version-stats">
        <span class="badge">${stats.count} trace(s)</span>
        <span class="badge">first: ${stats.first ? fmtTime(stats.first) : "—"}</span>
        <span class="badge">last: ${stats.last ? fmtTime(stats.last) : "—"}</span>
      </div>
      <div class="version-meta">
        <div><strong>${escapeHtml(c.short_hash)}</strong> by ${escapeHtml(c.author)} on ${fmtTime(c.date)}</div>
        <div class="commit-message">${escapeHtml(c.message)}</div>
        <div class="dim">${c.parent ? "parent " + escapeHtml(c.parent.slice(0, 10)) + "…" : "no parent (first commit in repo)"}</div>
      </div>
      <h4>Files changed vs. its parent commit</h4>
      <pre class="code-block">${escapeHtml(c.stat || "(no changes)")}</pre>
      <h4>Full diff vs. its parent commit</h4>
      ${renderDiff(c.diff)}
    `;
  } catch (err) {
    bodyHtml = `
      <div class="version-stats">
        <span class="badge">${stats.count} trace(s)</span>
        <span class="badge">first: ${stats.first ? fmtTime(stats.first) : "—"}</span>
        <span class="badge">last: ${stats.last ? fmtTime(stats.last) : "—"}</span>
      </div>
      <p class="missing">Could not load git info for this commit: ${escapeHtml(String(err.message || err))}</p>
    `;
  }
  $("#modal-body").innerHTML = bodyHtml;
}

async function showStageInfo(stage) {
  openModal(`Stage: ${stage}`, '<p class="missing">Loading…</p>');
  const stats = computeTagStats("cartwheel.hw_stage", stage);
  const commits = computeStageCommits(stage);
  const stages = allStagesSorted();
  const idx = stages.indexOf(stage);
  const prevStage = idx > 0 ? stages[idx - 1] : null;

  const commitListHtml = commits.map(c => `
    <div class="commit-row" data-hash="${escapeHtml(c.commit)}">
      <span class="mono">${escapeHtml(c.commit.slice(0, 10))}…</span>
      <span class="dim">${c.count} trace(s) · ${fmtTime(c.first)} → ${fmtTime(c.last)}</span>
    </div>
  `).join("") || '<p class="missing">No commit hash recorded on any trace under this stage.</p>';

  let diffHtml = '<p class="missing">This is the earliest tagged stage seen -- nothing earlier to compare against.</p>';
  const fromCommit = prevStage ? computeStageCommits(prevStage).slice(-1)[0]?.commit : null;
  const toCommit = commits.slice(-1)[0]?.commit;
  if (prevStage && fromCommit && toCommit && fromCommit !== toCommit) {
    try {
      const resp = await fetch(`/api/git/diff?from=${encodeURIComponent(fromCommit)}&to=${encodeURIComponent(toCommit)}`);
      if (!resp.ok) throw new Error((await resp.json()).detail || resp.status);
      const d = await resp.json();
      diffHtml = `
        <div class="dim">comparing latest ${escapeHtml(prevStage)} commit (${escapeHtml(fromCommit.slice(0, 10))}…) to latest ${escapeHtml(stage)} commit (${escapeHtml(toCommit.slice(0, 10))}…)</div>
        <h4>Files changed</h4>
        <pre class="code-block">${escapeHtml(d.stat || "(no changes)")}</pre>
        <h4>Full diff</h4>
        ${renderDiff(d.diff)}
      `;
    } catch (err) {
      diffHtml = `<p class="missing">Could not load diff vs. ${escapeHtml(prevStage)}: ${escapeHtml(String(err.message || err))}</p>`;
    }
  } else if (prevStage && fromCommit && fromCommit === toCommit) {
    diffHtml = `<p class="missing">Same commit (${escapeHtml(fromCommit.slice(0, 10))}…) as ${escapeHtml(prevStage)} -- no code changed between these two stages.</p>`;
  } else if (prevStage) {
    diffHtml = `<p class="missing">Missing a commit hash for ${!fromCommit ? escapeHtml(prevStage) : escapeHtml(stage)} -- can't compute a diff.</p>`;
  }

  $("#modal-body").innerHTML = `
    <div class="version-stats">
      <span class="badge">${stats.count} trace(s)</span>
      <span class="badge">first: ${stats.first ? fmtTime(stats.first) : "—"}</span>
      <span class="badge">last: ${stats.last ? fmtTime(stats.last) : "—"}</span>
    </div>
    <h4>Commits seen under this stage</h4>
    ${commitListHtml}
    <h4>${prevStage ? `Diff vs. previous stage (${escapeHtml(prevStage)})` : "Comparison"}</h4>
    ${diffHtml}
  `;
  $$(".commit-row[data-hash]", $("#modal-body")).forEach(row => {
    row.onclick = () => showCommitInfo(row.dataset.hash);
  });
}

$("#modal-close").onclick = closeModal;
$("#version-modal-overlay").onclick = (e) => {
  if (e.target.id === "version-modal-overlay") closeModal();
};

const THEME_KEY = "cartwheel-trace-viewer-theme";

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  $("#theme-toggle").textContent = theme === "dark" ? "☀️" : "🌙";
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (err) { /* private mode etc. */ }
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved || (prefersDark ? "dark" : "light"));
}

$("#theme-toggle").onclick = () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (err) { /* private mode etc. */ }
};

initTheme();

$("#refresh-btn").onclick = loadTraces;
$("#filter-stage").onchange = renderTraceList;
$("#filter-commit").onchange = renderTraceList;
loadTraces();
</script>
</body>
</html>
